<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit — Space Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6fb;
      --surface: #fff;
      --surface-soft: #f7f8fc;
      --ink: #202443;
      --muted: #626a83;
      --line: #e7e9f2;
      --purple: #7159e8;
      --purple-deep: #5540c9;
      --purple-wash: #f0edff;
      --green: #126b43;
      --green-wash: #e8f8ef;
      --red: #b52d3d;
      --red-wash: #fff0f1;
      --console-grid: rgb(47 74 120 / 5%);
      --console-glow: rgb(45 182 199 / 8%);
      --console-border: #d8dfeb;
      --console-accent: #087d89;
      --console-button-ink: #fff;
      --focus-ring: #5540c9;
      --shadow: 0 24px 70px rgb(45 48 91 / 11%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #111321;
        --surface: #1b1e30;
        --surface-soft: #22263a;
        --ink: #f4f3ff;
        --muted: #a2a7c1;
        --line: #33374e;
        --purple: #a393ff;
        --purple-deep: #c0b5ff;
        --purple-wash: #302a50;
        --green: #73dfa5;
        --green-wash: #1d3d30;
        --red: #ff8c98;
        --red-wash: #482830;
        --console-grid: rgb(168 194 230 / 7%);
        --console-glow: rgb(73 208 220 / 10%);
        --console-border: #414a62;
        --console-accent: #77e0e5;
        --console-button-ink: #14272b;
        --focus-ring: #f5cb70;
        --shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 20px;
      background:
        radial-gradient(ellipse at 12% 8%, rgb(178 161 255 / 20%), transparent 34rem),
        radial-gradient(ellipse at 92% 92%, rgb(116 195 255 / 15%), transparent 30rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 620px);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 22px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, #a58cff, #7057e8);
      box-shadow: 0 6px 16px rgb(113 89 232 / 28%);
      color: white;
      font-size: 17px;
      letter-spacing: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 490px;
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid var(--console-border);
      border-radius: 20px;
      background-color: var(--surface);
      background-image:
        radial-gradient(ellipse at 50% 0%, var(--console-glow), transparent 30rem),
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px);
      background-size: auto, 24px 24px, 24px 24px;
      box-shadow: var(--shadow), inset 0 0 0 5px color-mix(in srgb, var(--console-border) 35%, transparent);
      animation: arrive .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #54d6df, #70d9a8 52%, #f0be65);
      content: "";
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--console-accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 2px;
      background: #32b8a0;
      box-shadow: 0 0 0 3px rgb(50 184 160 / 15%);
      content: "";
    }

    .console-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 26px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--console-border);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .console-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    .console-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #32b8a0;
      box-shadow: 0 0 10px rgb(50 184 160 / 55%);
    }

    .console-code { color: var(--console-accent); }
    .start-card .eyebrow, .result-card .eyebrow { justify-content: center; }

    h1, h2, p { margin-top: 0; }

    h1, h2 {
      margin-bottom: 12px;
      font-size: clamp(28px, 6vw, 38px);
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .intro-copy, .subcopy {
      max-width: 46ch;
      margin-bottom: 25px;
      color: var(--muted);
      font-size: 16px;
    }

    .hero {
      display: grid;
      width: 112px;
      height: 112px;
      margin: 18px auto 25px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 36px;
      background: linear-gradient(145deg, var(--purple-wash), var(--surface-soft));
      font-size: 56px;
      animation: float 4s ease-in-out infinite;
    }

    .start-card, .result-card { text-align: center; }
    .start-card .intro-copy, .result-card .subcopy { margin-right: auto; margin-left: auto; }

    .meta-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 0 25px;
    }

    .pill {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .primary-button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 24px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #725bdd, #654bd0);
      box-shadow: 0 9px 22px rgb(113 89 232 / 27%);
      color: #fff;
      cursor: pointer;
      font-weight: 750;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgb(113 89 232 / 34%);
    }

    .primary-button:focus-visible, .answer:focus-visible, .next-button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 10px;
    }

    .question-count {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 750;
    }

    .score span { color: var(--purple); }

    .progress-track {
      height: 9px;
      overflow: hidden;
      margin-bottom: 31px;
      border: 1px solid var(--console-border);
      border-radius: 3px;
      background: repeating-linear-gradient(90deg, var(--surface-soft) 0 12px, var(--console-border) 12px 14px);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #43bec8, #66d2aa);
      transition: width .5s cubic-bezier(.2,.8,.2,1);
    }

    .question-title {
      min-height: 2.3em;
      margin-bottom: 22px;
      font-size: clamp(22px, 4.5vw, 28px);
      letter-spacing: -.035em;
      line-height: 1.25;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      gap: 14px;
      padding: 11px 15px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      border-left: 3px solid var(--console-border);
      background: color-mix(in srgb, var(--surface) 90%, var(--surface-soft));
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--purple);
      border-left-color: var(--console-accent);
      background: var(--purple-wash);
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--console-border);
      border-radius: 7px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .answer.correct {
      border-color: var(--green);
      border-left-color: var(--green);
      background: var(--green-wash);
      color: var(--green);
      animation: pop .35s ease both;
    }

    .answer.correct .answer-letter {
      background: var(--green);
      color: var(--console-button-ink);
    }

    .answer.wrong {
      border-color: var(--red);
      border-left-color: var(--red);
      background: var(--red-wash);
      color: var(--red);
      animation: shake .42s ease both;
    }

    .answer.wrong .answer-letter {
      background: var(--red);
      color: var(--console-button-ink);
    }

    .answer.dimmed { background: var(--surface-soft); }

    .feedback {
      display: flex;
      min-height: 57px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid var(--console-border);
      border-left: 3px solid var(--console-accent);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 14px;
    }

    .feedback[hidden] { display: none; }
    .feedback-copy { display: flex; align-items: center; gap: 9px; }
    .feedback-icon { font-size: 20px; }

    .next-button {
      min-width: 126px;
      min-height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      background: var(--console-accent);
      color: var(--console-button-ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .next-button:hover { opacity: .86; }

    .result-score {
      display: grid;
      width: 128px;
      height: 128px;
      margin: 22px auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 42px;
      background: linear-gradient(145deg, var(--purple-wash), var(--surface-soft));
      font-size: 58px;
      animation: pop .55s cubic-bezier(.2,.8,.2,1) both;
    }

    .result-total {
      display: block;
      margin-top: -10px;
      color: var(--purple);
      font-size: 23px;
      font-weight: 800;
    }

    .footer-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    @keyframes pop {
      0% { transform: scale(.94); }
      65% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-5px); }
      30%, 60%, 90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .brand { margin-bottom: 16px; }
      .card { min-height: auto; border-radius: 23px; }
      .progress-track { margin-bottom: 25px; }
      .feedback { align-items: flex-start; flex-direction: column; }
      .next-button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Orbit space quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Orbit</span>
    </div>
    <section class="card" id="quiz" role="region" aria-label="Space quiz"></section>
    <p class="footer-note">A little space trivia, a lot of cosmic curiosity.</p>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Mercury", "Jupiter"],
        correct: 1,
        fact: "Mars looks red because iron minerals in its soil have rusted."
      },
      {
        question: "What is the name of the galaxy we call home?",
        answers: ["Andromeda", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"],
        correct: 2,
        fact: "Our Solar System sits in a small spiral arm of the Milky Way."
      },
      {
        question: "Which is the largest planet in our Solar System?",
        answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
        correct: 3,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        question: "What do astronauts wear to protect themselves in space?",
        answers: ["Flight suit", "Space suit", "Pressure jacket", "Thermal coat"],
        correct: 1,
        fact: "A space suit provides oxygen, pressure, and protection from extreme temperatures."
      },
      {
        question: "Which star is closest to Earth?",
        answers: ["Sirius", "Polaris", "The Sun", "Proxima Centauri"],
        correct: 2,
        fact: "The Sun is about 150 million kilometers (93 million miles) from Earth."
      },
      {
        question: "What is the name of the first human to walk on the Moon?",
        answers: ["Yuri Gagarin", "Buzz Aldrin", "John Glenn", "Neil Armstrong"],
        correct: 3,
        fact: "Neil Armstrong took humanity's first lunar steps on July 20, 1969."
      },
      {
        question: "Which planet has the most prominent ring system?",
        answers: ["Saturn", "Uranus", "Jupiter", "Neptune"],
        correct: 0,
        fact: "Saturn's bright rings are made mostly of countless pieces of ice and rock."
      },
      {
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Gravity", "Friction", "Solar wind"],
        correct: 1,
        fact: "The Sun's gravity keeps the planets following their curved paths through space."
      },
      {
        question: "Which planet is famous for its Great Red Spot?",
        answers: ["Mars", "Venus", "Jupiter", "Saturn"],
        correct: 2,
        fact: "The Great Red Spot is a giant storm on Jupiter that has raged for centuries."
      },
      {
        question: "What is the name of NASA's famous space telescope launched in 1990?",
        answers: ["Kepler Telescope", "Hubble Space Telescope", "Spitzer Telescope", "Chandra Observatory"],
        correct: 1,
        fact: "The Hubble Space Telescope has transformed our view of the universe for decades."
      }
    ];

    const quiz = document.querySelector("#quiz");
    let current = 0;
    let score = 0;
    let answered = false;

    function startQuiz() {
      current = 0;
      score = 0;
      answered = false;
      renderQuestion();
    }

    function renderIntro() {
      quiz.className = "card start-card";
      quiz.innerHTML = `
        <p class="eyebrow">Your mission awaits</p>
        <div class="console-heading"><span class="console-brand"><span class="console-light" aria-hidden="true"></span>Mission control</span><span class="console-code">Station 01</span></div>
        <h1>Ready for liftoff?</h1>
        <p class="intro-copy">Explore the cosmos one question at a time. See how much you know about planets, stars, and the people who ventured beyond Earth.</p>
        <div class="hero" aria-hidden="true">🚀</div>
        <div class="meta-row">
          <span class="pill">10 questions</span>
          <span class="pill">About 3 minutes</span>
        </div>
        <button class="primary-button" type="button" id="start">Begin your mission <span aria-hidden="true">→</span></button>
      `;
      quiz.querySelector("#start").addEventListener("click", startQuiz);
    }

    function renderQuestion() {
      answered = false;
      const item = questions[current];
      const progress = Math.round((current / questions.length) * 100);
      quiz.className = "card";
      quiz.innerHTML = `
        <div class="topline">
          <span class="question-count">QUESTION ${current + 1} <span aria-hidden="true">/</span> ${questions.length}</span>
          <span class="score" role="status" aria-label="Score ${score} out of ${questions.length}" aria-atomic="true"><span aria-hidden="true">⭐</span> <span>${score}</span> pts</span>
        </div>
        <div class="console-heading"><span class="console-brand"><span class="console-light" aria-hidden="true"></span>Mission control</span><span class="console-code">Sector ${String(current + 1).padStart(2, "0")}</span></div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${current}">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
        <p class="eyebrow">Choose your answer</p>
        <h1 class="question-title" id="question-title" tabindex="-1">${item.question}</h1>
        <div class="answers" role="group" aria-label="Answer choices for question ${current + 1}">
          ${item.answers.map((answer, index) => `
            <button class="answer" type="button" data-answer="${index}" aria-label="Answer ${String.fromCharCode(65 + index)}: ${answer}">
              <span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span>
              <span>${answer}</span>
            </button>
          `).join("")}
        </div>
        <div class="feedback" id="feedback" hidden>
          <div class="feedback-copy" role="status" aria-label="Answer feedback" aria-atomic="true"><span class="feedback-icon" aria-hidden="true"></span><span class="feedback-text"></span></div>
          <button class="next-button" type="button" id="next">Next question →</button>
        </div>
      `;
      quiz.querySelectorAll(".answer").forEach(button => {
        button.addEventListener("click", () => chooseAnswer(Number(button.dataset.answer)));
      });
      quiz.querySelector("#next").addEventListener("click", advance);
      quiz.querySelector(".progress-track").setAttribute("aria-valuenow", String(current));
      quiz.querySelector("#question-title").focus();
    }

    function chooseAnswer(choice) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...quiz.querySelectorAll(".answer")];
      const correct = choice === item.correct;

      if (correct) score++;
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) button.classList.add("correct");
        else if (index === choice) button.classList.add("wrong");
        else button.classList.add("dimmed");
      });

      quiz.querySelector(".score").innerHTML = `<span aria-hidden="true">⭐</span> <span>${score}</span> pts`;
      quiz.querySelector(".score").setAttribute("aria-label", `Score ${score} out of ${questions.length}`);
      const feedback = quiz.querySelector("#feedback");
      feedback.hidden = false;
      feedback.querySelector(".feedback-icon").textContent = correct ? "✨" : "💫";
      feedback.querySelector(".feedback-text").textContent = correct
        ? `That's right! ${item.fact}`
        : `Not quite — ${item.fact}`;
      quiz.querySelector("#next").textContent = current === questions.length - 1 ? "See results →" : "Next question →";
      quiz.querySelector("#next").focus();
    }

    function advance() {
      if (!answered) return;
      current++;
      if (current < questions.length) renderQuestion();
      else renderResults();
    }

    function renderResults() {
      const percent = score / questions.length;
      let emoji = "🌱";
      let title = "Curious explorer!";
      let message = "Every great space mission starts with curiosity. Keep exploring and you'll be a cosmic pro in no time.";

      if (percent === 1) {
        emoji = "🏆";
        title = "Out of this world!";
        message = "A perfect mission! Your space knowledge is truly stellar.";
      } else if (percent >= 0.7) {
        emoji = "🌟";
        title = "Stellar work!";
        message = "You know your way around the cosmos. That's an impressive mission.";
      } else if (percent >= 0.4) {
        emoji = "🪐";
        title = "Nice orbit!";
        message = "You've got a great start. There's always more universe to discover.";
      }

      quiz.className = "card result-card";
      quiz.innerHTML = `
        <p class="eyebrow">Mission complete</p>
        <div class="console-heading"><span class="console-brand"><span class="console-light" aria-hidden="true"></span>Mission control</span><span class="console-code">Debrief</span></div>
        <div class="result-score" aria-hidden="true">${emoji}</div>
        <h1 id="result-title" tabindex="-1">${title}</h1>
        <span class="result-total">${score} <span style="color:var(--muted);font-size:15px;font-weight:650">out of ${questions.length} correct</span></span>
        <p class="subcopy" style="margin-top:17px">${message}</p>
        <button class="primary-button" type="button" id="replay">Launch another mission <span aria-hidden="true">↻</span></button>
      `;
      quiz.querySelector("#replay").addEventListener("click", startQuiz);
      quiz.querySelector("#result-title").focus();
    }

    renderIntro();
  </script>
</body>
</html>
